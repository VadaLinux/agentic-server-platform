apiVersion: v1
kind: Namespace
metadata:
  name: agentic-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
  namespace: agentic-platform
  labels:
    app: omniroute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omniroute
  template:
    metadata:
      labels:
        app: omniroute
    spec:
      containers:
      - name: omniroute
        image: omniroute:latest
        ports:
        - containerPort: 20128
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATA_DIR
          value: "/data"
        volumeMounts:
        - name: omniroute-storage
          mountPath: /data
      volumes:
      - name: omniroute-storage
        persistentVolumeClaim:
          claimName: omniroute-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: omniroute-service
  namespace: agentic-platform
spec:
  type: ClusterIP
  ports:
  - port: 20128
    targetPort: 20128
  selector:
    app: omniroute
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-backend
  namespace: agentic-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multica-backend
  template:
    metadata:
      labels:
        app: multica-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/multica-ai/multica-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: APP_ENV
          value: "production"
        - name: MULTICA_LLM_BASE_URL
          value: "http://omniroute-service:20128/v1"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: multica-secrets
              key: database-url
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-frontend
  namespace: agentic-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multica-frontend
  template:
    metadata:
      labels:
        app: multica-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/multica-ai/multica-web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: REMOTE_API_URL
          value: "http://multica-backend-service:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: multica-frontend-service
  namespace: agentic-platform
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: multica-frontend
